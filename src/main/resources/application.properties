server.port=0

# 上传限制（与 pipeline.max-upload-bytes 配合）
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# 派生管线配置（默认值见 PipelineProperties，可按需覆盖）
pipeline.max-upload-bytes=20971520
pipeline.max-pixels=40000000
pipeline.max-dimension=8192
pipeline.worker-threads=4
pipeline.queue-capacity=64
pipeline.block-when-full=false
pipeline.offer-timeout-millis=2000
pipeline.processing-timeout-millis=60000
pipeline.max-decoded-bytes=536870912
pipeline.cache-dir=build/derivative-cache
pipeline.original-dir=build/originals
pipeline.cache-version=1
