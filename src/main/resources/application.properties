server.port=0

# multipart 上传限制（略大于流水线自身上限）
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# 流水线处理语义与配置项（默认值，可通过命令行/环境变量覆盖）
# 产物存储目录
pipeline.storage-dir=data
# 上传原图大小上限（字节）
pipeline.max-upload-bytes=20971520
# 原图单边像素上限
pipeline.max-source-dimension=8000
# 原图总像素上限
pipeline.max-source-pixels=40000000
# 派生图单边像素上限
pipeline.max-target-dimension=4096
# 派生图总像素上限
pipeline.max-target-pixels=16000000
# 处理线程数（并发上界），默认 CPU 核数
pipeline.worker-threads=4
# 等待队列容量，超过即拒绝（CAPACITY_EXCEEDED）
pipeline.queue-capacity=128
# 单任务处理超时（毫秒）
pipeline.task-timeout-millis=30000
# 派生结果过期时间（毫秒），按最后访问时间续期
pipeline.cache-ttl-millis=604800000
